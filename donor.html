<!DOCTYPE html>
<html>
<head>
    <title>Donor Registration - Blood Bridge</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            text-align: center;
        }

        .container {
            width: 400px;
            margin: 40px auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
        }

        h1 {
            color: #c62828;
        }

        input, select {
            width: 90%;
            padding: 10px;
            margin: 8px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            padding: 10px 25px;
            margin-top: 15px;
            background: #c62828;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🩸 Donor Registration</h1>

    <form>

        <input type="text" placeholder="Full Name" required>

        <input type="number" placeholder="Age" required>

        <select required>
            <option value="">Select Blood Group</option>
            <option>A+</option>
            <option>A-</option>
            <option>B+</option>
            <option>B-</option>
            <option>AB+</option>
            <option>AB-</option>
            <option>O+</option>
            <option>O-</option>
        </select>

        <input type="tel" placeholder="Phone Number" required>

        <input type="email" placeholder="Email" required>

        <input type="text" placeholder="Location" required>

        <select required>
            <option value="">Availability</option>
            <option>Available</option>
            <option>Not Available</option>
        </select>

        <br>

        <button type="submit">Register</button>

    </form>

</div>

</body>
</html>
